name: build-payloads-v3
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build catalog + download payloads
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: python scripts/build_payloads_v3.py --out out --mirror-base "https://github.com/${{ github.repository }}/releases/download/payloads-mirror"
      - name: Upload files to release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          gh release view payloads-mirror >/dev/null 2>&1 || gh release create payloads-mirror --title "payloads-mirror" --notes "auto-built mirror"
          gh release upload payloads-mirror out/files/* --clobber
      - name: Prepare site
        run: mkdir site && cp out/payloads_v3.json out/icons.json site/ 2>/dev/null; ls site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
